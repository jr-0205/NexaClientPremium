<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05090d" />
    <title>NEXA Client</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #05090d; }
      .nexa-boot {
        position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; isolation: isolate;
        background: #05090d; color: #f2f5f7; font: 14px 'Segoe UI', sans-serif;
      }
      .nexa-boot::before {
        content: ''; position: absolute; z-index: -3; inset: -22px;
        background: url('/brand/nexa-night-background.png') center/cover no-repeat;
        filter: blur(7px) saturate(.88) brightness(.72); transform: scale(1.035);
      }
      .nexa-boot::after {
        content: ''; position: absolute; z-index: -2; inset: 0;
        background:
          radial-gradient(circle at 50% 35%, rgba(190,214,228,.08), transparent 25%),
          radial-gradient(circle at 50% 50%, transparent 28%, rgba(1,5,8,.42) 76%, rgba(1,4,7,.76) 100%),
          linear-gradient(180deg, rgba(3,8,12,.20), rgba(3,8,12,.58));
      }
      .nexa-boot-card {
        position: relative; width: min(430px, calc(100vw - 52px)); min-height: 260px; box-sizing: border-box;
        padding: 34px 42px 30px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #f2f5f7; text-align: center;
      }
      .nexa-boot-card::before, .nexa-boot-card::after {
        content: ''; position: absolute; left: 11%; right: 11%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(207,223,232,.30), transparent);
      }
      .nexa-boot-card::before { top: 0; }
      .nexa-boot-card::after { bottom: 0; }
      .nexa-boot-mark {
        width: 68px; height: 74px; object-fit: contain; opacity: .97;
        filter: saturate(.08) brightness(1.55) drop-shadow(0 12px 24px rgba(0,0,0,.28));
      }
      .nexa-boot-name { margin-top: 2px; color: #e6edf1; font-size: 12px; font-weight: 720; letter-spacing: .31em; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
      .nexa-boot-phase { margin-top: 7px; color: #91a2ad; font-size: 8px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
      .nexa-boot-spinner {
        width: 20px; height: 20px; margin: 18px auto 10px; border: 1px solid rgba(198,216,226,.22);
        border-top-color: rgba(231,239,244,.94); border-radius: 50%; animation: nexa-boot-spin .95s linear infinite;
      }
      .nexa-boot-copy { color: #a9b6be; font-size: 11px; line-height: 1.55; text-shadow: 0 1px 10px rgba(0,0,0,.42); }
      @keyframes nexa-boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (() => {
        const errors = [];
        window.addEventListener("error", (event) => {
          errors.push(event.message || "Error desconocido al cargar la interfaz.");
        });
        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          errors.push(reason && reason.message ? reason.message : String(reason || "Promesa rechazada sin detalle."));
        });
        window.setTimeout(() => {
          const root = document.getElementById("root");
          const boot = root?.querySelector("[data-nexa-boot]");
          if (!root || (root.childElementCount > 0 && !boot)) return;
          const detail = errors.length ? errors.slice(-4).join("\n") : "El bundle JavaScript no llegó a montar React. Comprueba que dist/assets fue copiado completo a wwwroot/assets.";
          root.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#070a10;color:#f4f7fc;font:14px 'Segoe UI',sans-serif"><section style="width:min(720px,90vw);padding:30px;border:1px solid #26364d;border-radius:8px;background:linear-gradient(145deg,#161f2e,#0d131e);box-shadow:0 24px 70px rgba(0,0,0,.35)"><div style="color:#91a9b8;font-size:11px;font-weight:700;letter-spacing:.12em">NEXA · DIAGNÓSTICO DE INTERFAZ</div><h1 style="margin:10px 0 8px;font-size:26px">React no pudo iniciar</h1><p style="margin:0 0 16px;color:#9eacbf;line-height:1.6">La ventana de escritorio y WebView2 están funcionando, pero la UI no llegó a montarse.</p><pre style="margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;border-radius:6px;background:#090e16;color:#d8e2f1;border:1px solid #26364d">${detail.replace(/[&<>]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[char]))}</pre></section></main>`;
        }, 2200);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="nexa-boot" data-nexa-boot>
        <div class="nexa-boot-card">
          <img class="nexa-boot-mark" src="/brand/nexa-mark.png" alt="" />
          <div class="nexa-boot-name">N E X A&nbsp;&nbsp; C L I E N T</div>
          <div class="nexa-boot-phase">NEXA CORE · INICIALIZANDO</div>
          <div class="nexa-boot-spinner"></div>
          <div class="nexa-boot-copy">Preparando perfiles, cuenta y runtime…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
